<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" role="img" aria-labelledby="title desc">
  <title id="title">Smartphone motherboard diagnostic map</title><desc id="desc">Conceptual board showing the flow from power input through PMIC, processor, memory and RF, with measurement and verification points.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0d1928" flood-opacity=".14"/></filter></defs>
  <rect width="520" height="540" rx="20" fill="#eef5fa"/>
  <g font-family="Arial, sans-serif" fill="#0d1928"><text x="34" y="47" font-size="13" font-weight="700" letter-spacing="2">DIAGNOSTIC MAP</text><text x="34" y="72" font-size="18" font-weight="700">Smartphone motherboard</text></g>
  <g stroke="#62cbd4" stroke-width="3" fill="none" stroke-linecap="round"><path d="M100 207H153M227 207H276M345 207H417"/><path d="M314 250V319M314 385V441"/><path d="M190 250V307M190 370V441"/></g>
  <g filter="url(#shadow)"><rect x="52" y="165" width="102" height="84" rx="12" fill="#fff"/><rect x="153" y="165" width="75" height="84" rx="12" fill="#0759b5"/><rect x="276" y="165" width="69" height="84" rx="12" fill="#0d1928"/><rect x="417" y="165" width="64" height="84" rx="12" fill="#fff"/><rect x="145" y="307" width="90" height="64" rx="12" fill="#fff"/><rect x="276" y="319" width="77" height="66" rx="12" fill="#fff"/><rect x="148" y="441" width="205" height="57" rx="12" fill="#0759b5"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><text x="103" y="196" font-size="11" fill="#0759b5" font-weight="700">POWER INPUT</text><text x="103" y="218" font-size="9" fill="#5e6b79">VBAT / VBUS</text><text x="191" y="197" font-size="13" fill="#fff" font-weight="700">PMIC</text><text x="310" y="197" font-size="12" fill="#fff" font-weight="700">CPU</text><text x="449" y="196" font-size="11" fill="#0759b5" font-weight="700">RF</text><text x="449" y="218" font-size="9" fill="#5e6b79">TX / RX</text><text x="190" y="334" font-size="12" fill="#0759b5" font-weight="700">MEMORY</text><text x="190" y="353" font-size="9" fill="#5e6b79">UFS / RAM</text><text x="314" y="346" font-size="11" fill="#0759b5" font-weight="700">CLOCKS</text><text x="314" y="364" font-size="9" fill="#5e6b79">RESET / ENABLE</text><text x="250" y="465" font-size="12" fill="#fff" font-weight="700">MEASURE → ISOLATE → VERIFY</text><text x="250" y="483" font-size="9" fill="#d9f7fa">EVIDENCE-BASED REPAIR</text></g>
  <g fill="#19c7d4"><circle cx="100" cy="207" r="5"/><circle cx="229" cy="207" r="5"/><circle cx="275" cy="207" r="5"/><circle cx="346" cy="207" r="5"/><circle cx="314" cy="319" r="5"/><circle cx="190" cy="307" r="5"/></g>
  <g font-family="Arial, sans-serif" fill="#5e6b79" font-size="10"><text x="55" y="125">POWER RAILS</text><text x="278" y="125">SIGNAL PATHS</text><text x="362" y="286">TIMING</text><text x="55" y="414">STORAGE</text></g>
</svg>
